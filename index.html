<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>AI Chat — your keys, your browser</title>
<meta name="color-scheme" content="dark light"/>
<meta name="theme-color" content="#171310"/>
<link rel="icon" type="image/png" href="icon.png"/>
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet"/>
<meta name="description" content="A privacy-first AI chat client. Bring your own API key; everything stays in your browser."/>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#171310;--bg2:#1f1915;--surface:#262019;--surface2:#2f2822;
  --text:#f7f1e8;--muted:#b3a48e;--border:rgba(255,255,255,.09);
  --accent:#ff8a5c;--accent2:#ffc46b;--accent3:#8fe3a0;
  --grad:linear-gradient(135deg,#ff7a45,#ffb35c);
  --user-text:#2b1a10;--code-bg:#120e0c;--shadow:0 8px 28px rgba(0,0,0,.35);
  --radius:18px;--display:"Baloo 2","SF Pro Rounded",ui-rounded,system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#faf6ef;--bg2:#f3ece1;--surface:#ffffff;--surface2:#f5eee3;
  --text:#2b2118;--muted:#7d6c5c;--border:rgba(90,55,20,.12);
  --accent:#e8590c;--accent2:#f2a65a;--accent3:#2f9e44;
  --grad:linear-gradient(135deg,#e8590c,#f2a65a);
  --user-text:#2b1a10;--code-bg:#262019;--shadow:0 8px 24px rgba(190,110,40,.14);
}
html,body{height:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.brand b,.empty h2{font-family:var(--display);letter-spacing:.01em}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"SF Pro Rounded","Hiragino Maru Gothic ProN",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.55;overscroll-behavior-y:none}
#app{display:flex;height:100dvh;overflow:hidden}
/* ---------- sidebar ---------- */
#sidebar{width:300px;flex:0 0 300px;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:60}
.side-head{padding:16px 14px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mascot{width:42px;height:42px;flex:0 0 42px}
.brand b{font-size:17px;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--muted)}
.conv-list{flex:1;overflow-y:auto;padding:4px 10px;display:flex;flex-direction:column;gap:6px}
.conv-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;transition:background .15s,transform .1s}
.conv-item:hover{background:var(--surface2)}
.conv-item.active{background:var(--surface2);border-color:var(--border)}
.conv-item:active{transform:scale(.98)}
.conv-item .t{flex:1;min-width:0}
.conv-item .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item .t span{font-size:12px;color:var(--muted)}
.conv-item .del{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;border-radius:8px}
.conv-item .del:hover{color:#ff6b8a;background:rgba(255,107,138,.12)}
.side-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px}
#scrim{display:none}
/* ---------- main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(8px);z-index:5}
.chat-title{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-weight:700;font-size:16px;
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:6px 8px;border-radius:10px}
.chat-title:hover{background:var(--surface2)}
#chatbar{display:flex;gap:8px;padding:10px 14px;align-items:center;border-bottom:1px solid var(--border)}
#chatbar select{flex:1;min-width:0}
select,input[type=text],input[type=password],input[type=url],textarea{
  background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;
  padding:9px 12px;font:inherit;font-size:14px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
/* ---------- messages ---------- */
#messages{flex:1;overflow-y:auto;padding:18px 14px 8px}
.wrap{max-width:820px;margin:0 auto;width:100%}
.msg{display:flex;margin:0 0 14px;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.bubble{position:relative;max-width:min(88%,640px);padding:11px 14px;border-radius:18px;
  overflow-wrap:anywhere}
.msg.user .bubble{background:var(--grad);color:var(--user-text);border-bottom-right-radius:6px}
.msg.assistant .bubble{background:var(--surface);border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:6px;width:100%;max-width:100%}
.msg.assistant{justify-content:flex-start}
.msg .bubble.err{background:rgba(255,90,110,.1);border-color:rgba(255,90,110,.4)}
.copy-btn{position:absolute;top:6px;right:6px;border:0;background:var(--surface2);color:var(--muted);
  border-radius:9px;font-size:12px;padding:4px 8px;cursor:pointer;opacity:0;transition:opacity .15s}
.msg:hover .copy-btn,.copy-btn:focus-visible{opacity:1}
@media(hover:none){.copy-btn{opacity:.75}}
.msg .imgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.msg .imgs img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.md{font-size:15.5px}
.md p{margin:.5em 0}.md p:first-child{margin-top:0}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{line-height:1.3;margin:.8em 0 .4em}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md a{color:var(--accent3)}
.md blockquote{border-left:3px solid var(--accent);margin:.6em 0;padding:.2em .8em;color:var(--muted)}
.md code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.86em;
  background:color-mix(in srgb,var(--accent) 14%,transparent);padding:2px 6px;border-radius:7px}
.codeblock{margin:.7em 0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.codebar{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);
  padding:6px 10px;font-size:12px;color:var(--muted)}
.codeblock pre{margin:0;background:var(--code-bg);padding:12px;overflow-x:auto}
.codeblock pre code{background:none;padding:0;color:#f5ead9;font-size:13px}
[data-theme="light"] .codeblock pre code{color:#f5ead9}
.mini-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;
  font-size:12px;padding:3px 10px;cursor:pointer}
.mini-btn:hover{border-color:var(--accent)}
.md table{border-collapse:collapse;margin:.6em 0;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left}
/* ---------- composer ---------- */
#composer{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);
  background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(10px)}
#attachBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
#attachBar:empty{margin:0}
.thumb{position:relative;width:64px;height:64px}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.thumb button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;
  background:#e5485e;color:#fff;font-size:12px;cursor:pointer;line-height:1}
.composer-row{display:flex;gap:8px;align-items:flex-end}
#input{flex:1;resize:none;max-height:160px;border-radius:14px;line-height:1.45}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;
  width:44px;height:44px;font-size:19px;cursor:pointer;flex:0 0 44px;display:grid;place-items:center;transition:transform .1s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.danger{border-color:rgba(255,90,110,.5);color:#ff6b8a}
.send-btn{border:0;border-radius:14px;width:48px;height:44px;flex:0 0 48px;font-size:20px;cursor:pointer;
  background:var(--grad);color:#2b1a10;box-shadow:var(--shadow);transition:transform .1s}
.send-btn:active{transform:scale(.9)}
.send-btn:disabled{opacity:.45}
.privacy{text-align:center;font-size:11.5px;color:var(--muted);margin-top:7px}
/* ---------- buttons ---------- */
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;
  padding:10px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);border:0;color:#2b1a10;width:100%}
.btn.ghost{flex:1;background:var(--surface)}
.btn.danger-zone{border-color:rgba(255,90,110,.5);color:#ff6b8a;width:100%}
.btn-row{display:flex;gap:8px;margin-top:12px}
/* ---------- empty state ---------- */
.empty{text-align:center;padding:8vh 20px 40px;max-width:560px;margin:0 auto}
.empty .mascot{width:110px;height:110px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.empty h2{font-size:27px;margin:14px 0 6px;font-weight:700}
.empty p{color:var(--muted);font-size:14.5px}
.steps{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px 18px;margin:18px 0;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.step .n{flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#2b1a10;
  display:grid;place-items:center;font-weight:700;font-size:14px}
.cors-note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 14px;margin-top:14px}
/* ---------- modal ---------- */
#modalRoot:empty{display:none}
.modal-scrim{position:fixed;inset:0;background:rgba(8,5,14,.6);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:22px 22px 0 0;width:100%;max-width:560px;
  max-height:92dvh;overflow-y:auto;padding:20px;animation:slideup .22s ease-out}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
  font-size:17px;cursor:pointer;padding:4px}
.prov-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);
  border-radius:12px;margin-bottom:8px;background:var(--surface)}
.prov-row .pi{flex:1;min-width:0}
.prov-row .pi b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prov-row .pi span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:150px;overflow-y:auto}
.chip{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:4px 11px;
  font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.range-val{font-size:13px;color:var(--muted);text-align:right}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:999px;
  font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
/* ---------- desktop ---------- */
#menuBtn{display:none}
@media(max-width:860px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-106%);transition:transform .25s ease;
    box-shadow:var(--shadow)}
  body.nav-open #sidebar{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:0;background:rgba(8,5,14,.55);z-index:55}
  #menuBtn{display:grid}
  .msg .bubble{max-width:94%}
}
@media(min-width:861px){
  .modal-scrim{align-items:center;padding:20px}
  .modal{border-radius:22px}
  #chatbar{max-width:848px;margin:0 auto;width:100%}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand">
        <svg class="mascot" viewBox="0 0 96 96" aria-hidden="true">
          <defs><linearGradient id="mgA" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ffc46b"/>
          </linearGradient></defs>
          <line x1="48" y1="16" x2="48" y2="28" stroke="#ff8a5c" stroke-width="5" stroke-linecap="round"/>
          <circle cx="48" cy="13" r="6" fill="#ffc46b"/>
          <rect x="18" y="28" width="60" height="52" rx="24" fill="url(#mgA)"/>
          <ellipse cx="37" cy="52" rx="7" ry="8.5" fill="#fff"/>
          <ellipse cx="59" cy="52" rx="7" ry="8.5" fill="#fff"/>
          <circle cx="38.5" cy="53.5" r="3.4" fill="#2a1f16"/>
          <circle cx="60.5" cy="53.5" r="3.4" fill="#2a1f16"/>
          <circle cx="29" cy="62" r="4.5" fill="#fff" opacity=".45"/>
          <circle cx="67" cy="62" r="4.5" fill="#fff" opacity=".45"/>
          <path d="M41 65 Q48 70 55 65" stroke="#2a1f16" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
        <div><b>AI Chat</b><span>🔒 100% in your browser</span></div>
      </div>
      <button id="newChatBtn" class="btn primary">＋ New chat</button>

    <div id="convList" class="conv-list"></div>
    <div class="side-foot">
      <button id="providersBtn" class="btn ghost">🔌 Providers</button>

    </div>

  <div id="scrim"></div>
  <main id="main">
    <header id="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      <button id="chatTitle" class="chat-title" title="Tap to rename">New chat</button>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">🌙</button>
    </header>
    <div id="chatbar">
      <select id="provSel" aria-label="Provider"></select>
      <select id="modelSel" aria-label="Model"></select>
      <button id="convCfgBtn" class="icon-btn" title="Chat settings" style="width:40px;height:40px;flex-basis:40px;font-size:17px">⚙️</button>
    </div>

    <div id="composer">
      <div class="wrap">
        <div id="attachBar"></div>

          <button id="attachBtn" class="icon-btn" title="Attach image">📎</button>
          <textarea id="input" rows="1" placeholder="Message your AI…"></textarea>
          <button id="stopBtn" class="icon-btn danger" hidden title="Stop generating">⏹</button>
          <button id="sendBtn" class="send-btn" title="Send">➤</button>

      </div>

  </main>
</div>
<div id="modalRoot"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden/>
<input type="file" id="importInput" accept="application/json,.json" hidden/>

<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const fmtDate=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2300);}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Copied ✓');}
  catch(e){
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copied ✓');}catch(_){toast('Copy failed 😢');}
    ta.remove();
  }
}
/* ================= settings (localStorage) ================= */
const LS_SET='wca_settings_v1', LS_CONV='wca_convs_v1';
let S={theme:'dark',providers:[],activeProviderId:null,activeConvId:null};
function loadSettings(){try{const s=JSON.parse(localStorage.getItem(LS_SET));if(s&&typeof s==='object')S=Object.assign(S,s);}catch(e){}}
function saveSettings(){try{localStorage.setItem(LS_SET,JSON.stringify(S));}catch(e){toast('Could not save settings 😢');}}
const activeProvider=()=>S.providers.find(p=>p.id===S.activeProviderId)||S.providers[0]||null;
/* ================= conversations (IndexedDB, localStorage fallback) ================= */
const ConvDB={
  db:null,useLS:false,
  init(){
    return new Promise(res=>{
      if(!('indexedDB' in window)){this.useLS=true;res();return;}
      try{
        const q=indexedDB.open('webchatai',1);
        q.onupgradeneeded=()=>{q.result.createObjectStore('convs',{keyPath:'id'});};
        q.onsuccess=()=>{this.db=q.result;res();};
        q.onerror=()=>{this.useLS=true;res();};
        q.onblocked=()=>{this.useLS=true;res();};
      }catch(e){this.useLS=true;res();}
    });
  },
  _lsAll(){try{return JSON.parse(localStorage.getItem(LS_CONV))||[];}catch(e){return[];}},
  _lsSave(a){try{localStorage.setItem(LS_CONV,JSON.stringify(a));}catch(e){}},
  all(){
    if(this.useLS)return Promise.resolve(this._lsAll());
    return new Promise(res=>{
      try{
        const tx=this.db.transaction('convs','readonly');
        const rq=tx.objectStore('convs').getAll();
        rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res(this._lsAll());
      }catch(e){res(this._lsAll());}
    });
  },
  put(c){
    if(this.useLS){const a=this._lsAll().filter(x=>x.id!==c.id);a.unshift(c);this._lsSave(a);return Promise.resolve();}
    return new Promise(res=>{
      try{
        const tx=this.db.transaction('convs','readwrite');
        tx.objectStore('convs').put(c);
        tx.oncomplete=()=>res();tx.onerror=()=>res();
      }catch(e){res();}
    });
  },
  del(id){
    if(this.useLS){this._lsSave(this._lsAll().filter(x=>x.id!==id));return Promise.resolve();}
    return new Promise(res=>{
      try{
        const tx=this.db.transaction('convs','readwrite');
        tx.objectStore('convs').delete(id);
        tx.oncomplete=()=>res();tx.onerror=()=>res();
      }catch(e){res();}
    });
  },
  clear(){
    if(this.useLS){this._lsSave([]);return Promise.resolve();}
    return new Promise(res=>{
      try{
        const tx=this.db.transaction('convs','readwrite');
        tx.objectStore('convs').clear();
        tx.oncomplete=()=>res();tx.onerror=()=>res();
      }catch(e){res();}
    });
  }
};
/* ================= state ================= */
let convs=[];          // newest first
let cur=null;          // active conversation
let pendingImages=[];  // dataURLs waiting to send
let streaming=false, aborter=null;
function newConversation(){
  const p=activeProvider();
  cur={id:uid(),title:'New chat',providerId:p?p.id:null,model:p?(p.defaultModel||''):'',
       system:'',temperature:0.7,maxTokens:0,messages:[],createdAt:Date.now(),updatedAt:Date.now()};
  convs.unshift(cur);S.activeConvId=cur.id;saveSettings();
  renderAll();setTimeout(()=>$('#input').focus(),50);
}
function persist(){if(!cur)return Promise.resolve();cur.updatedAt=Date.now();return ConvDB.put(cur);}
function msgText(m){
  if(typeof m.content==='string')return m.content;
  return m.content.filter(p=>p.type==='text').map(p=>p.text).join('\n');
}
function msgImages(m){
  if(typeof m.content==='string')return [];
  return m.content.filter(p=>p.type==='image_url').map(p=>p.image_url.url);
}
/* ================= markdown + sanitize ================= */
function sanitize(html){
  const t=document.createElement('template');t.innerHTML=html;
  t.content.querySelectorAll('script,iframe,object,embed,form,style,link,meta').forEach(e=>e.remove());
  t.content.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{
      const n=a.name.toLowerCase();
      if(n.startsWith('on')||((n==='href'||n==='src'||n==='xlink:href')&&/^\s*javascript:/i.test(a.value)))el.removeAttribute(a.name);
    });
    const tag=el.tagName.toLowerCase();
    if(tag==='a'){el.setAttribute('target','_blank');el.setAttribute('rel','noopener');}
  });
  return t.innerHTML;
}
function mdRender(src){
  let html;
  if(window.marked&&typeof marked.parse==='function'){
    try{html=marked.parse(src,{breaks:true});}
    catch(e){html='<p>'+esc(src)+'</p>';}
  }else{html='<p>'+esc(src).replace(/\n/g,'<br>')+'</p>';}
  const d=document.createElement('div');d.className='md';d.innerHTML=sanitize(html);
  d.querySelectorAll('pre').forEach(pre=>{
    const code=pre.querySelector('code');
    const lang=(code&&/language-([\w+-]+)/.exec(code.className||'')||[])[1]||'code';
    const wrap=document.createElement('div');wrap.className='codeblock';
    const bar=document.createElement('div');bar.className='codebar';
    const lab=document.createElement('span');lab.textContent=lang;bar.appendChild(lab);
    const b=document.createElement('button');b.className='mini-btn';b.textContent='Copy';
    b.onclick=()=>{copyText(code?code.innerText:pre.innerText);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy',1200);};
    bar.appendChild(b);wrap.appendChild(bar);pre.replaceWith(wrap);wrap.appendChild(pre);
  });
  return d;
}
/* ================= message rendering ================= */
function msgEl(m){
  const d=document.createElement('div');
  d.className='msg '+(m.role==='user'?'user':'assistant');
  const b=document.createElement('div');b.className='bubble'+(m.err?' err':'');
  if(m.role==='user'){
    const imgs=msgImages(m);
    if(imgs.length){const w=document.createElement('div');w.className='imgs';
      imgs.forEach(u=>{const im=document.createElement('img');im.src=u;im.alt='attached image';im.loading='lazy';w.appendChild(im);});
      b.appendChild(w);}
    const t=document.createElement('div');t.textContent=msgText(m);t.style.whiteSpace='pre-wrap';b.appendChild(t);
  }else{
    b.appendChild(mdRender(m.content||''));
  }
  const cp=document.createElement('button');cp.className='copy-btn';cp.textContent='⧉';
  cp.title='Copy message';cp.setAttribute('aria-label','Copy message');
  cp.onclick=e=>{e.stopPropagation();copyText(msgText(m));};
  b.appendChild(cp);d.appendChild(b);
  return d;
}
function scrollBottom(force){
  const m=$('#messages');
  const near=m.scrollHeight-m.scrollTop-m.clientHeight<140;
  if(near||force)m.scrollTop=m.scrollHeight;
}
function renderMessages(){
  const w=$('#msgWrap');w.innerHTML='';
  if(!cur||!cur.messages.length){w.appendChild(emptyState());return null;}
  cur.messages.forEach(m=>w.appendChild(msgEl(m)));
  scrollBottom(true);
  const bubbles=w.querySelectorAll('.msg.assistant .bubble');
  const last=bubbles[bubbles.length-1];
  return last?last.querySelector('.md'):null;
}

function loadConversation(id){
  const c=convs.find(x=>x.id===id);if(!c)return;
  cur=c;S.activeConvId=id;saveSettings();
  if(c.providerId&&S.providers.some(p=>p.id===c.providerId))S.activeProviderId=c.providerId;
  document.body.classList.remove('nav-open');

async function deleteConversation(id){
  const c=convs.find(x=>x.id===id);
  if(!confirm('Delete "'+(c?c.title:'this chat')+'"? This cannot be undone.'))return;
  await ConvDB.del(id);
  convs=convs.filter(x=>x.id!==id);
  if(cur&&cur.id===id){cur=convs[0]||null;S.activeConvId=cur?cur.id:null;saveSettings();}
  renderAll();toast('Chat deleted 🗑');
}
async function clearAllConversations(){
  if(!convs.length){toast('Nothing to clear');return;}
  if(!confirm('Delete ALL '+convs.length+' conversations? This cannot be undone.'))return;
  await ConvDB.clear();convs=[];cur=null;S.activeConvId=null;saveSettings();
  renderAll();toast('All chats cleared 🧹');
}
/* ================= chat: send + stream ================= */
function updateStreamUI(){
  $('#sendBtn').hidden=streaming;
  $('#stopBtn').hidden=!streaming;
  $('#input').disabled=streaming;
}
function buildPayload(conv,model){
  const msgs=[];
  if(conv.system&&conv.system.trim())msgs.push({role:'system',content:conv.system.trim()});
  conv.messages.forEach(m=>{
    if(m.err)return;
    if(m.role!=='user'&&m.role!=='assistant')return;
    if(typeof m.content==='string'&&!m.content.trim())return;
    msgs.push({role:m.role,content:m.content});
  });
  const body={model:model,messages:msgs,stream:true,temperature:conv.temperature};
  if(conv.maxTokens>0)body.max_tokens=conv.maxTokens;
  return body;
}
async function sendMessage(){
  const text=$('#input').value.trim();
  if((!text&&!pendingImages.length)||streaming)return;
  const p=activeProvider();
  if(!p){toast('Add a provider first 🔌');openProviders();return;}
  if(!cur)newConversation();
  if($('#provSel').value&&$('#provSel').value!==cur.providerId){
    cur.providerId=$('#provSel').value;
    const np=S.providers.find(x=>x.id===cur.providerId);
    cur.model=np?(np.defaultModel||''):'';
  }else{cur.providerId=p.id;}
  S.activeProviderId=cur.providerId;saveSettings();
  let model=$('#modelSel').value;
  if(model==='__custom'){
    const mid=prompt('Model ID:','');
    if(!mid||!mid.trim())return;
    model=mid.trim();
    const o=document.createElement('option');o.value=model;o.textContent=model+' ✓';
    $('#modelSel').insertBefore(o,$('#modelSel').lastChild);$('#modelSel').value=model;
  }
  if(!model){toast('Pick a model first 🤔');return;}
  cur.model=model;
  const parts=[];
  if(text)parts.push({type:'text',text:text});
  pendingImages.forEach(u=>parts.push({type:'image_url',image_url:{url:u}}));
  const content=(parts.length===1&&parts[0].type==='text')?text:parts;
  cur.messages.push({role:'user',content:content,ts:Date.now()});
  if(cur.messages.filter(m=>m.role==='user').length===1&&text)cur.title=text.slice(0,42);
  $('#input').value='';autogrow();pendingImages=[];renderAttach();
  await persist();renderSidebar();renderChatBar();
  const am={role:'assistant',content:'',ts:Date.now()};
  cur.messages.push(am);
  const target=renderMessages();
  // ---- stream ----
  streaming=true;updateStreamUI();aborter=new AbortController();
  const prov=S.providers.find(x=>x.id===cur.providerId);
  const base=(prov.baseURL||'').replace(/\/+$/,'');
  const headers={'Content-Type':'application/json'};
  if(prov.apiKey)headers['Authorization']='Bearer '+prov.apiKey;
  let acc='';
  const paint=()=>{if(target){target.innerHTML='';target.appendChild(mdRender(acc+'▍'));}scrollBottom(false);};
  try{
    const res=await fetch(base+'/chat/completions',{
      method:'POST',headers:headers,signal:aborter.signal,
      body:JSON.stringify(buildPayload(cur,model))
    });
    if(!res.ok){
      let detail='';
      try{const t=await res.text();try{detail=JSON.parse(t).error.message||t;}catch(e){detail=t;}}
      catch(e){detail='(no response body)';}
      throw new Error('HTTP '+res.status+(detail?': '+String(detail).slice(0,300):''));
    }
    if(!res.body)throw new Error('Empty response body');
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const r=await reader.read();
      if(r.done)break;
      buf+=dec.decode(r.value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){
        const t=ln.trim();if(!t.startsWith('data:'))continue;
        const d=t.slice(5).trim();
        if(d==='[DONE]')continue;
        try{
          const j=JSON.parse(d);
          const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
          if(c){acc+=c;paint();}
        }catch(e){/* partial chunk, ignore */}
      }
    }
  }catch(e){
    if(e&&e.name==='AbortError'){
      if(!acc)acc='(stopped)';
    }else if(e instanceof TypeError){
      am.err=true;
      am.content='⚠️ **Network error** — the request never reached the provider.\n\n'
        +'This usually means the provider blocks browser requests (**CORS**) or the base URL is wrong.\n'
        +'Check the base URL in Providers, and for local models (Ollama) start with `OLLAMA_ORIGINS=*`.\n\n'
       +'`'+esc(e.message||'fetch failed')+'`';
    }else{
      am.err=true;
      am.content='⚠️ **Request failed**\n\n`'+esc(e.message||String(e))+'`';
    }
  }finally{
    streaming=false;updateStreamUI();aborter=null;
  }
  if(!am.err)am.content=acc;
  cur.updatedAt=Date.now();
  await persist();renderMessages();renderSidebar();
}
function stopStream(){if(aborter)aborter.abort();}
/* ================= image attach ================= */
function renderAttach(){
  const bar=$('#attachBar');bar.innerHTML='';
  pendingImages.forEach((u,i)=>{
    const w=document.createElement('div');w.className='thumb';
    const im=document.createElement('img');im.src=u;im.alt='attachment '+(i+1);w.appendChild(im);
    const x=document.createElement('button');x.textContent='✕';x.title='Remove';x.setAttribute('aria-label','Remove image');
    x.onclick=()=>{pendingImages.splice(i,1);renderAttach();};
    w.appendChild(x);bar.appendChild(w);
  });
}
function processImage(f){
  if(!f.type||!f.type.startsWith('image/')){toast('Only images please 🖼');return;}
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{
    const max=1568,s=Math.min(1,max/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    pendingImages.push(c.toDataURL('image/jpeg',0.85));
    renderAttach();toast('Image attached ✨');
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Could not read that image 😢');};
  img.src=url;
}
function autogrow(){
  const ta=$('#input');ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,160)+'px';
}
/* ================= modal helper ================= */
function openModal(title,sub,bodyHTML){
  const root=$('#modalRoot');
  root.innerHTML='<div class="modal-scrim"><div class="modal" role="dialog" aria-modal="true">'
    +'<h3>'+title+'</h3>'+(sub?'<p class="sub">'+sub+'</p>':'')
    +'<div class="modal-body"></div></div></div>';
  const bodyEl=root.querySelector('.modal-body');
  if(typeof bodyHTML==='string')bodyEl.innerHTML=bodyHTML;
  else if(bodyHTML)bodyEl.appendChild(bodyHTML);
  const close=()=>{root.innerHTML='';};
  root.querySelector('.modal-scrim').addEventListener('mousedown',e=>{if(e.target.classList.contains('modal-scrim'))close();});
  return {root,body:bodyEl,close};
}
/* ================= providers ================= */
function openProviders(){
  const m=openModal('🔌 Providers','Each provider needs a name, base URL and your API key. Keys stay in this browser only.');
  const b=m.body;
  const list=document.createElement('div');b.appendChild(list);
  function draw(){
    list.innerHTML='';
    if(!S.providers.length)list.innerHTML='<p class="sub">No providers yet. Add one to start chatting ✨</p>';
    S.providers.forEach(p=>{
      const row=document.createElement('div');row.className='prov-row';
      const pi=document.createElement('div');pi.className='pi';
      const nm=document.createElement('b');nm.textContent=p.name;pi.appendChild(nm);
      const u=document.createElement('span');u.textContent=p.baseURL;pi.appendChild(u);
      row.appendChild(pi);
      const eb=document.createElement('button');eb.className='mini-btn';eb.textContent='Edit';
      eb.onclick=()=>providerForm(p,draw);row.appendChild(eb);
      const db=document.createElement('button');db.className='mini-btn';db.textContent='🗑';
      db.onclick=()=>{
        if(!confirm('Delete provider "'+p.name+'"?'))return;
        S.providers=S.providers.filter(x=>x.id!==p.id);
        if(S.activeProviderId===p.id)S.activeProviderId=S.providers[0]?S.providers[0].id:null;
        saveSettings();draw();renderChatBar();
      };
      row.appendChild(db);list.appendChild(row);
    });
    const add=document.createElement('button');add.className='btn primary';add.textContent='＋ Add provider';
    add.style.marginTop='6px';add.onclick=()=>providerForm(null,draw);list.appendChild(add);
    const done=document.createElement('button');done.className='btn ghost';done.textContent='Done';
    done.style.width='100%';done.style.marginTop='10px';done.onclick=m.close;list.appendChild(done);
  }
  draw();
}
function providerForm(p,refresh){
  const isNew=!p;
  p=p||{id:uid(),name:'',baseURL:'https://api.openai.com/v1',apiKey:'',models:[],defaultModel:''};
  const m=openModal(isNew?'＋ Add provider':'✏️ Edit provider','Base URL looks like https://api.openai.com/v1 — no trailing /chat/completions.');
  const b=m.body;
  b.innerHTML=
    '<div class="field"><label>Name</label><input type="text" id="pfName" placeholder="e.g. DeepSeek" value="'+esc(p.name)+'"></div>'
   +'<div class="field"><label>Base URL</label><input type="url" id="pfURL" placeholder="https://api.openai.com/v1" value="'+esc(p.baseURL)+'"></div>'
   +'<div class="field"><label>API key <span style="font-weight:400">(stored only in this browser)</span></label>'
   +'<div class="pw-wrap"><input type="password" id="pfKey" placeholder="sk-…" value="'+esc(p.apiKey)+'">'
   +'<button type="button" id="pfShow" title="Show/hide">👁</button></div></div>'
   +'<div class="field"><label>Models</label>'
   +'<div class="btn-row" style="margin:0 0 8px"><button class="btn ghost" id="pfFetch" type="button">↻ Fetch models</button></div>'
   +'<div class="model-chips" id="pfChips"></div>'
   +'<label style="margin-top:8px">Default model <span style="font-weight:400">(or type any ID)</span></label>'
   +'<input type="text" id="pfModel" placeholder="e.g. deepseek-chat" value="'+esc(p.defaultModel||'')+'"></div>'
   +'<div class="btn-row"><button class="btn primary" id="pfSave" type="button" style="flex:2">Save</button>'
   +'<button class="btn ghost" id="pfCancel" type="button">Cancel</button></div>'
   +'<p class="sub" id="pfStatus" style="margin:10px 0 0"></p>';
  $('#pfShow',b).onclick=()=>{const i=$('#pfKey',b);i.type=i.type==='password'?'text':'password';};
  function $(s,r){return (r||document).querySelector(s);}
  function drawChips(models){
    const c=$('#pfChips',b);c.innerHTML='';
    models.forEach(id=>{
      const ch=document.createElement('button');ch.type='button';ch.className='chip';ch.textContent=id;
      ch.title='Use as default model';
      ch.onclick=()=>{$('#pfModel',b).value=id;toast('Default: '+id);};
      c.appendChild(ch);
    });
  }
  drawChips(p.models||[]);
  $('#pfFetch',b).onclick=async()=>{
    const base=$('#pfURL',b).value.trim().replace(/\/+$/,''),key=$('#pfKey',b).value.trim();
    const st=$('#pfStatus',b);st.textContent='Fetching…';
    if(!base){st.textContent='Enter a base URL first.';return;}
    try{
      const h={};if(key)h['Authorization']='Bearer '+key;
      const r=await fetch(base+'/models',{headers:h});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      const ids=((j&&j.data)||[]).map(x=>x.id).filter(Boolean).sort();
      if(!ids.length){st.textContent='No models returned.';return;}
      p.models=ids;drawChips(ids);
      st.textContent='Got '+ids.length+' models ✓ — tap one to set it as default.';
    }catch(e){
      st.textContent=e instanceof TypeError
        ?'⚠️ Could not reach it — check the URL, or CORS may be blocking browser requests.'
        :'⚠️ '+e.message;
    }
  };
  $('#pfCancel',b).onclick=m.close;
  $('#pfSave',b).onclick=()=>{
    p.name=$('#pfName',b).value.trim()||'Provider';
    p.baseURL=$('#pfURL',b).value.trim().replace(/\/+$/,'');
    p.apiKey=$('#pfKey',b).value.trim();
    p.defaultModel=$('#pfModel',b).value.trim();
    if(!p.baseURL){toast('Base URL is required');return;}
    if(!S.providers.some(x=>x.id===p.id))S.providers.push(p);
    if(!S.activeProviderId)S.activeProviderId=p.id;
    saveSettings();m.close();if(refresh)refresh();renderChatBar();
    if(cur&&cur.providerId===p.id)renderChatBar();
    toast('Provider saved ✓');
  };
}

  if(!cur)newConversation();
  const m=openModal('⚙️ Chat settings','Applies to this conversation only.');
  const b=m.body;
  b.innerHTML=
    '<div class="field"><label>System prompt <span style="font-weight:400">(optional)</span></label>'
   +'<textarea id="csSys" rows="3" placeholder="e.g. You are a cheerful coding buddy…"></textarea></div>'
   +'<div class="field"><label>Temperature: <span id="csTempV"></span></label>'
   +'<input type="range" id="csTemp" min="0" max="2" step="0.1"></div>'
   +'<div class="field"><label>Max tokens: <span id="csTokV"></span></label>'
   +'<input type="range" id="csTok" min="0" max="16000" step="256"><div class="range-val">0 = provider default</div></div>'
   +'<div class="btn-row"><button class="btn primary" id="csSave" style="flex:2">Save</button>'
   +'<button class="btn ghost" id="csCancel">Cancel</button></div>';
  const sys=b.querySelector('#csSys'),tr=b.querySelector('#csTemp'),tv=b.querySelector('#csTempV'),
        tk=b.querySelector('#csTok'),kv=b.querySelector('#csTokV');
  sys.value=cur.system||'';tr.value=cur.temperature;tk.value=cur.maxTokens;
  const upd=()=>{tv.textContent=tr.value;kv.textContent=tk.value==='0'?'Auto':tk.value;};
  tr.oninput=upd;tk.oninput=upd;upd();
  b.querySelector('#csCancel').onclick=m.close;
  b.querySelector('#csSave').onclick=async()=>{
    cur.system=sys.value;cur.temperature=parseFloat(tr.value);cur.maxTokens=parseInt(tk.value,10);
    await persist();m.close();toast('Settings saved ✓');
  };
}
/* ================= backup & restore ================= */
function openBackup(){
  const m=openModal('💾 Backup & restore','Everything is a single JSON file: providers, settings and all conversations.');
  const b=m.body;
  b.innerHTML=
    '<div class="btn-row" style="margin-top:0"><button class="btn primary" id="bkExp" style="flex:1">⬇ Export JSON</button>'
   +'<button class="btn ghost" id="bkImp" style="flex:1">⬆ Import JSON</button></div>'
   +'<p class="sub" style="margin-top:12px">Import <b>replaces</b> everything currently stored in this browser. Export first if you are unsure.</p>'
   +'<hr style="border:0;border-top:1px solid var(--border);margin:16px 0">'
   +'<button class="btn danger-zone" id="bkClear">🧹 Delete all conversations</button>'
   +'<div class="btn-row"><button class="btn ghost" id="bkDone" style="width:100%">Done</button></div>';
  b.querySelector('#bkExp').onclick=exportJSON;
  b.querySelector('#bkImp').onclick=()=>$('#importInput').click();
  b.querySelector('#bkClear').onclick=async()=>{await clearAllConversations();m.close();};
  b.querySelector('#bkDone').onclick=m.close;
}
function exportJSON(){
  const data={app:'web-chat-ai',version:1,exportedAt:new Date().toISOString(),
    settings:{theme:S.theme,providers:S.providers,activeProviderId:S.activeProviderId},
    conversations:convs};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='web-chat-ai-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Backup downloaded ✓');
}
function importJSON(file){
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||d.app!=='web-chat-ai'||!Array.isArray(d.conversations))throw new Error('bad file');
      if(!confirm('Replace everything in this browser with this backup?\n('+d.conversations.length+' chats, '+((d.settings&&d.settings.providers)||[]).length+' providers)'))return;
      await ConvDB.clear();
      for(const c of d.conversations)await ConvDB.put(c);
      convs=d.conversations.slice().sort((a,b2)=>b2.updatedAt-a.updatedAt);
      if(d.settings){
        S.theme=d.settings.theme||'dark';
        S.providers=Array.isArray(d.settings.providers)?d.settings.providers:[];
        S.activeProviderId=d.settings.activeProviderId||null;
      }
      cur=convs[0]||null;S.activeConvId=cur?cur.id:null;saveSettings();
      renderAll();toast('Backup restored ✓');
    }catch(e){toast('That file is not a valid backup 😢');}
  };
  r.onerror=()=>toast('Could not read file 😢');
  r.readAsText(file);
}
/* ================= events + init ================= */
function wireEvents(){
  $('#menuBtn').onclick=()=>document.body.classList.toggle('nav-open');
  $('#scrim').onclick=()=>document.body.classList.remove('nav-open');
  $('#newChatBtn').onclick=()=>{newConversation();document.body.classList.remove('nav-open');};
  $('#themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';saveSettings();applyTheme();};
  $('#chatTitle').onclick=()=>{
    if(!cur)return;
    const t=prompt('Rename chat:',cur.title||'');
    if(t&&t.trim()){cur.title=t.trim().slice(0,80);persist();renderSidebar();renderChatBar();}
  };
  $('#provSel').onchange=e=>{
    const id=e.target.value;if(!id)return;
    S.activeProviderId=id;saveSettings();
    if(cur){cur.providerId=id;const p=S.providers.find(x=>x.id===id);cur.model=p?(p.defaultModel||''):'';
      persist();}
    renderChatBar();
  };
  $('#modelSel').onchange=e=>{
    if(e.target.value==='__custom'){
      const mid=prompt('Model ID:','');
      if(mid&&mid.trim()){
        const o=document.createElement('option');o.value=mid.trim();o.textContent=mid.trim()+' ✓';
        e.target.insertBefore(o,e.target.lastChild);e.target.value=mid.trim();
      }else{renderChatBar();return;}
    }
    if(cur){cur.model=e.target.value;persist();}
  };
  $('#convCfgBtn').onclick=openConvSettings;
  $('#sendBtn').onclick=sendMessage;
  $('#stopBtn').onclick=stopStream;
  $('#attachBtn').onclick=()=>$('#fileInput').click();
  $('#fileInput').onchange=e=>{[...e.target.files].forEach(processImage);e.target.value='';};
  const ta=$('#input');
  ta.addEventListener('input',autogrow);
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
  });
  $('#providersBtn').onclick=()=>{openProviders();document.body.classList.remove('nav-open');};
  $('#backupBtn').onclick=()=>{openBackup();document.body.classList.remove('nav-open');};
  $('#importInput').onchange=e=>{
    if(e.target.files.length)importJSON(e.target.files[0]);
    e.target.value='';
  };
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalRoot').innerHTML='';});
}
(async function init(){
  loadSettings();
  document.documentElement.dataset.theme=S.theme||'dark';
  await ConvDB.init();
  convs=(await ConvDB.all()).sort((a,b)=>b.updatedAt-a.updatedAt);
  if(!S.activeProviderId&&S.providers.length)S.activeProviderId=S.providers[0].id;
  cur=convs.find(c=>c.id===S.activeConvId)||null;
  wireEvents();
  renderAll();
  autogrow();
})();
</script>
